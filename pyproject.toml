[project]
name = "orc-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "sqlalchemy[asyncio]>=2.0.52",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import 정렬
    "B",    # flake8-bugbear
    "UP",   # 최신 Python 문법 권장
    "SIM",  # 불필요하게 복잡한 코드 단순화
]

ignore = [
    "B008", # FastAPI Depends(), Query() 등을 함수 기본값에서 사용
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires TEST_DB_URL pointing to a migrated PostgreSQL database",
]

[tool.hatch.build.targets.wheel]

packages = ["src/ors"]
